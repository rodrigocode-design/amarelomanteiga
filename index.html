<head>
<meta charset="utf-8">

<title>Amarelo Manteiga</title>
<meta name="description" content="Amarelo Manteiga — confeitaria artesanal. Site em construção.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --manteiga:#F4C542;
  --choco:#412812;
  --creme:#FBF6E7;
}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%}
body{
  margin:0;background:var(--manteiga);color:var(--choco);
  font-family:"Karla",system-ui,sans-serif;
  display:flex;flex-direction:column;min-height:100%;
}
.topo{display:flex;justify-content:flex-end;padding:1rem 1.3rem 0}
.interno{
  display:inline-block;text-decoration:none;
  font-size:.85rem;font-weight:600;
  color:color-mix(in srgb,var(--choco) 72%,transparent);
  border:1.5px solid color-mix(in srgb,var(--choco) 28%,transparent);
  border-radius:999px;padding:.45rem 1rem;
  transition:color .18s ease,border-color .18s ease,background .18s ease;
}
.interno:hover,.interno:focus-visible{
  color:var(--choco);border-color:var(--choco);
  background:color-mix(in srgb,var(--creme) 55%,transparent);
}
:focus-visible{outline:2.5px solid var(--choco);outline-offset:3px}
main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:1.5rem 1.3rem 3rem;
}
.selo{
  width:min(340px,76vw);border-radius:50%;
  box-shadow:0 14px 40px rgba(65,40,18,.22);
  animation:surge .9s ease-out both;
}
@keyframes surge{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.aviso{
  font-family:"Bodoni Moda",Georgia,serif;
  font-size:clamp(1.25rem,3.6vw,1.75rem);
  font-weight:400;line-height:1.35;
  margin:2.3rem 0 .7rem;max-width:22ch;
}
.aviso i{font-style:italic}
.sub{
  font-size:1rem;margin:0;max-width:34ch;
  color:color-mix(in srgb,var(--choco) 78%,transparent);
}
footer{
  padding:1.4rem;text-align:center;font-size:.82rem;
  color:color-mix(in srgb,var(--choco) 62%,transparent);
}
</style>
</head>
